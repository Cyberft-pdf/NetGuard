<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetGuard</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1d2433; --muted: #5b6475; --line: #e3e7ee;
    --accent: #2f6fed; --good: #1f9d55; --warning: #d98c00; --bad: #d64545; --info: #5b6475;
    --good-bg: #e7f6ee; --warning-bg: #fdf3e0; --bad-bg: #fbe9e9; --info-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1b212b; --text: #e8ecf2; --muted: #9aa4b5; --line: #2a3240;
      --accent: #6b9bff; --good: #43c47e; --warning: #f0aa2c; --bad: #f06b6b; --info: #9aa4b5;
      --good-bg: #15301f; --warning-bg: #352a12; --bad-bg: #3a1a1a; --info-bg: #232a35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header svg { width: 40px; height: 40px; color: var(--accent); }
  h1 { font-size: 28px; margin: 0; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; }
  #scan { background: var(--accent); color: #fff; font-size: 20px; font-weight: 600; padding: 16px 40px; }
  #scan:disabled { opacity: .6; cursor: wait; }
  .center { text-align: center; padding: 24px 0; }
  .spinner { width: 44px; height: 44px; border: 4px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  .overall { border-radius: 16px; padding: 20px 24px; margin: 8px 0 20px; }
  .overall h2 { margin: 0 0 4px; font-size: 22px; }
  .overall p { margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 16px 18px; margin-bottom: 12px; display: flex; gap: 14px; }
  .icon { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
          color: #fff; font-weight: 700; font-size: 17px; }
  .card h3 { margin: 0 0 2px; font-size: 18px; }
  .card p { margin: 0; }
  .advice { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--info-bg); }
  .advice b { display: block; font-size: 14px; color: var(--muted); }
  details { margin-top: 8px; color: var(--muted); font-size: 15px; }
  details ul { margin: 6px 0 0; padding-left: 18px; font-family: Consolas, ui-monospace, monospace; font-size: 13px;
               overflow-wrap: anywhere; }
  summary { cursor: pointer; }
  .good { --c: var(--good); --cbg: var(--good-bg); }
  .warning { --c: var(--warning); --cbg: var(--warning-bg); }
  .bad { --c: var(--bad); --cbg: var(--bad-bg); }
  .info { --c: var(--info); --cbg: var(--info-bg); }
  .icon { background: var(--c); }
  .overall { background: var(--cbg); border-left: 6px solid var(--c); }
  .card.bad, .card.warning { border-left: 5px solid var(--c); }
  h2.section { font-size: 20px; margin: 36px 0 12px; }
  .checklist { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 18px; }
  .checklist label { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .checklist label:last-child { border-bottom: 0; }
  .checklist input { width: 20px; height: 20px; flex: none; margin-top: 3px; }
  .checklist small { display: block; color: var(--muted); }
  #rescan { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 8px 22px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>
    </svg>
    <h1>NetGuard</h1>
  </header>
  <p class="lead">A quick, friendly safety check of your home network. It only looks. It never changes anything.</p>

  <div id="start" class="center">
    <button id="scan">Check my network</button>
    <p class="lead" style="margin-top:12px">Takes about 30 seconds.</p>
  </div>

  <div id="busy" class="center hidden">
    <div class="spinner"></div>
    <p>Checking your network&hellip;</p>
  </div>

  <section id="report" class="hidden">
    <div id="overall" class="overall"></div>
    <div id="cards"></div>
    <div class="center"><button id="rescan">Check again</button></div>
  </section>

  <h2 class="section">Things only you can check</h2>
  <div class="checklist" id="checklist"></div>
</main>

<template id="card-tpl">
  <div class="card">
    <div class="icon"></div>
    <div>
      <h3></h3>
      <p class="summary"></p>
      <div class="advice hidden"><b>What to do</b><span></span></div>
      <details class="hidden"><summary>Show details</summary><ul></ul></details>
    </div>
  </div>
</template>

<script>
const TOKEN = "{{TOKEN}}";
const ICONS = { good: "✓", warning: "!", bad: "✕", info: "i" };
const ORDER = { bad: 0, warning: 1, info: 2, good: 3 };
const OVERALL = {
  good:    ["All good!", "We didn't find any problems. Check again every month or so."],
  warning: ["A few things to look at", "Nothing urgent, but the yellow items below would make your home network safer."],
  bad:     ["Needs your attention", "We found something that makes your network unsafe. Start with the red items below."],
};
const CHECKLIST = [
  ["Changed the router's admin password", "The password for the router's settings page should not be the one printed on its sticker."],
  ["Wi-Fi password is long and private", "At least 12 characters. Give guests the guest network instead, if your router has one."],
  ["Router updates itself", "Look for “automatic firmware updates” in the router settings, or ask your internet provider."],
  ["Smart gadgets on the guest network", "Cameras, smart plugs and TVs are safer on a separate guest Wi-Fi."],
  ["Different passwords everywhere", "A password manager makes this easy. Turn on two-step login for email and banking."],
];

const $ = (id) => document.getElementById(id);

function renderChecklist() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("netguard-checklist") || "{}"); } catch {}
  CHECKLIST.forEach(([title, help], i) => {
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!saved[i];
    box.onchange = () => {
      saved[i] = box.checked;
      try { localStorage.setItem("netguard-checklist", JSON.stringify(saved)); } catch {}
    };
    const text = document.createElement("span");
    text.textContent = title;
    const small = document.createElement("small");
    small.textContent = help;
    text.append(small);
    label.append(box, text);
    $("checklist").append(label);
  });
}

function renderReport(report) {
  const [heading, text] = OVERALL[report.overall];
  $("overall").className = "overall " + report.overall;
  $("overall").innerHTML = "<h2></h2><p></p>";
  $("overall").querySelector("h2").textContent = heading;
  $("overall").querySelector("p").textContent = text;

  $("cards").replaceChildren();
  report.results
    .sort((a, b) => ORDER[a.status] - ORDER[b.status])
    .forEach((r) => {
      const card = $("card-tpl").content.firstElementChild.cloneNode(true);
      card.classList.add(r.status);
      card.querySelector(".icon").textContent = ICONS[r.status];
      card.querySelector("h3").textContent = r.title;
      card.querySelector(".summary").textContent = r.summary;
      if (r.advice) {
        const advice = card.querySelector(".advice");
        advice.classList.remove("hidden");
        advice.querySelector("span").textContent = r.advice;
      }
      if (r.details.length) {
        const details = card.querySelector("details");
        details.classList.remove("hidden");
        r.details.forEach((d) => {
          const li = document.createElement("li");
          li.textContent = d;
          details.querySelector("ul").append(li);
        });
      }
      $("cards").append(card);
    });
}

async function scan() {
  $("start").classList.add("hidden");
  $("report").classList.add("hidden");
  $("busy").classList.remove("hidden");
  try {
    const res = await fetch("/api/scan", { method: "POST", headers: { "X-NetGuard-Token": TOKEN } });
    if (!res.ok) throw new Error(res.status);
    renderReport(await res.json());
    $("report").classList.remove("hidden");
  } catch (e) {
    alert("The check couldn't finish. Is the NetGuard window still open?");
    $("start").classList.remove("hidden");
  } finally {
    $("busy").classList.add("hidden");
  }
}

$("scan").onclick = scan;
$("rescan").onclick = scan;
renderChecklist();
</script>
</body>
</html>
